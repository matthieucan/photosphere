<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
  </head>

  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
          "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js"
        }
      }
    </script>

    <script type="module">
      import { Viewer } from '@photo-sphere-viewer/core';

      window.viewer = new Viewer({
        container: document.querySelector('#viewer'),
      });
    </script>

    <script>
      function loadPanorama() {
        const inputPanorama = document.getElementById("input-panorama").files[0];
        const url = URL.createObjectURL(inputPanorama);
        window.viewer.setPanorama(url);
      }
    </script>

    <input id="input-panorama" type="file">
    <br>
    <button onclick="loadPanorama()">Load</button>
    <div id="viewer" style="width: 90vw; height: 90vh;"></div>
  </body>
</html>
